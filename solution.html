<div class="eb">Pourquoi BAMM</div>
<h2 style="max-width:760px;margin-bottom:32px">Les autres agissent avant ou après. BAMM, pendant.</h2>
<div class="g">
<div class="c"><h3 style="font-size:22px">Sensibilisation</h3><p class="mut" style="margin:10px 0 0">Avant l'attaque. Français uniquement : l'utilisateur doit s'en souvenir sous pression.</p></div>
<div class="c"><h3 style="font-size:22px">Solutions opérateur</h3><p class="mut" style="margin:10px 0 0">Après l'attaque. Dashboards en anglais réservés aux équipes anti-fraude.</p></div>
<div class="c" style="border-color:#067047;background:#E2F5EA"><h3 style="font-size:22px;color:#067047">BAMM</h3><p style="margin:10px 0 0;line-height:1.6">Pendant l'attaque, sur le téléphone. Fon, yoruba, dendi, bariba, français. Hors ligne. Détection d'appels · interception USSD · base communautaire.</p></div>
</div></div>

<div class="w" style="padding-bottom:88px">
<div class="eb">Trois couches de protection</div>
<div class="g">
<div class="c"><h3 style="font-size:22px">Détection d'appels</h3><p class="mut" style="margin:10px 0 0">Le numéro entrant est comparé à la liste officielle des opérateurs et à la base communautaire, puis scoré. Au-delà d'un seuil : écran rouge, vibration, alerte vocale.</p></div>
<div class="c"><h3 style="font-size:22px">Interception USSD</h3><p class="mut" style="margin:10px 0 0">Avant l'exécution d'un code de transfert, l'application l'analyse et bloque si un appel suspect vient de se terminer.</p></div>
<div class="c"><h3 style="font-size:22px">Base communautaire</h3><p class="mut" style="margin:10px 0 0">Un signalement en un geste protège tous les autres membres. Une micro-leçon vocale de 15 secondes suit chaque incident.</p></div>
</div>
<h3 style="font-size:30px;margin:64px 0 12px">Conçu pour les non-lettrés</h3>
<p class="mut" style="max-width:640px;margin:0 0 20px">Langue choisie au premier lancement, alertes vocales dans la langue maternelle, interface par icônes et couleurs.</p>
