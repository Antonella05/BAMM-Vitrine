<div class="w" style="padding-top:56px;padding-bottom:48px"><div class="eb">Modèle économique</div>
<h2 style="max-width:860px">Gratuit pour l'utilisateur. Financé par ceux qui ont intérêt à réduire la fraude.</h2>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:40px">
<div class="c"><div class="eb">Utilisateurs</div><h3 style="font-size:21px">Protection gratuite</h3><p class="mut" style="margin:10px 0 0">5 langues, hors ligne, sans abonnement : la cible ne paie pas pour être protégée.</p></div><div class="mut" style="font-size:32px;align-self:center;text-align:center">→</div>
<div class="c" style="background:#E2F5EA;border-color:#067047"><div class="eb">BAMM</div><h3 style="font-size:21px">Détecte, bloque, apprend</h3><p class="mut" style="margin:10px 0 0">Chaque signalement enrichit la base communautaire.</p></div><div class="mut" style="font-size:32px;align-self:center;text-align:center">→</div>
<div class="c"><div class="eb">Partenaires</div><h3 style="font-size:21px">Opérateurs &amp; institutions</h3><p class="mut" style="margin:10px 0 0">Ils financent le service qui réduit leurs pertes et renforce la confiance.</p></div></div></div>
<div class="w" style="padding-bottom:56px"><div class="eb">Trois sources de revenus</div><div class="g"><div class="c"><h3 style="font-size:21px">1. Licences opérateurs</h3><p class="mut" style="margin:10px 0 0">MTN, Moov : intégrer la base communautaire et les signaux de risque BAMM à leurs outils anti-fraude, aujourd'hui des dashboards techniques en anglais qui détectent après l'attaque.</p></div><div class="c"><h3 style="font-size:21px">2. Partenariats &amp; financements</h3><p class="mut" style="margin:10px 0 0">Inclusion financière et numérique, langues locales : bailleurs, ONG et régulateurs ont intérêt à protéger les utilisateurs que personne ne protège aujourd'hui.</p></div><div class="c"><h3 style="font-size:21px">3. Tendances de fraude anonymisées</h3><p class="mut" style="margin:10px 0 0">Rapports agrégés sur les vecteurs d'attaque (vishing, USSD) pour les opérateurs et les autorités. Aucune donnée personnelle.</p></div></div></div>
<div class="w" style="padding-bottom:56px"><div class="eb">Pourquoi le modèle tient</div><div class="g"><div class="c"><h3 style="font-size:21px">Effet réseau</h3><p class="mut" style="margin:10px 0 0">Chaque numéro signalé protège tous les autres membres : plus il y a d'utilisateurs, plus la base vaut pour les opérateurs.</p></div><div class="c"><h3 style="font-size:21px">Coût d'exploitation faible</h3><p class="mut" style="margin:10px 0 0">Modèle de 19,3 Ko embarqué qui tourne hors ligne, et composants open source.</p></div><div class="c"><h3 style="font-size:21px">Adoption par la confiance</h3><p class="mut" style="margin:10px 0 0">Une alerte dans sa langue maternelle est comprise et suivie, c'est ce qui crée l'usage.</p></div></div></div>
<div class="w" style="padding-bottom:88px"><div class="eb">Déploiement</div><div class="g">
<div class="c"><div class="big" style="color:#C9E3D4">1</div><h3 style="font-size:21px;margin-top:8px">Bénin</h3><p class="mut" style="margin:8px 0 0">Utilisateurs MTN et Moov.</p></div>
<div class="c"><div class="big" style="color:#C9E3D4">2</div><h3 style="font-size:21px;margin-top:8px">Région</h3><p class="mut" style="margin:8px 0 0">Moov Togo et voisins.</p></div>
<div class="c"><div class="big" style="color:#C9E3D4">3</div><h3 style="font-size:21px;margin-top:8px">Continent</h3><p class="mut" style="margin:8px 0 0">MTN MoMo au Ghana, M-Pesa au Kenya.</p></div></div></div>
