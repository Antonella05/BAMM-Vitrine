<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAMM — Accueil</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6FAF7;color:#0B1F16;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.w{max-width:1100px;margin:0 auto;padding:0 24px;box-sizing:border-box}
h1,h2,h3,.big{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:clamp(28px,4vw,44px);line-height:1.08}
.eb{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#067047;font-weight:700;margin-bottom:14px}
.g{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.c{background:#fff;border:1px solid #DCE8E0;border-radius:18px;padding:26px}
.mut{color:#4F665A;line-height:1.6}
.btn{display:inline-block;padding:15px 26px;border-radius:999px;font-weight:700;text-decoration:none;background:#067047;color:#fff;border:0;font-size:16px;cursor:pointer}
.btn:hover{background:#0A8F5A}
.pill{padding:10px 18px;border-radius:999px;border:1px solid #BFD3C7;background:#fff;font-weight:700;font-size:15px;cursor:pointer;color:#0B1F16;font-family:inherit}
.pill:hover{border-color:#067047}
.big{font-size:clamp(34px,4.6vw,54px);color:#067047;line-height:1}
.bar{height:14px;border-radius:7px;background:#E2F5EA;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;transition:width .5s}
.pulse{animation:p 2s infinite}@keyframes p{to{box-shadow:0 0 0 36px rgba(198,47,37,0)}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}.bar i{transition:none}}
.nl{padding:9px 16px;border-radius:999px;text-decoration:none;color:#4F665A;font-weight:700;font-size:15px}.nl:hover{color:#067047}.on{background:#E2F5EA;color:#067047}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="width:100%;overflow:hidden">
<div class="w" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-top:20px;padding-bottom:8px"><a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#0B1F16;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:26px"><svg width="26" height="30" viewBox="0 0 30 34" aria-hidden="true"><path d="M15 2 3 7v9c0 8 5 13 12 16 7-3 12-8 12-16V7z" fill="none" stroke="#067047" stroke-width="3"/><path d="m9 17 5 5 8-9" fill="none" stroke="#067047" stroke-width="3"/></svg>BAMM</a><nav style="display:flex;gap:2px;flex-wrap:wrap"><a class="nl on" href="index.html">Accueil</a><a class="nl" href="probleme.html">Problème</a><a class="nl" href="solution.html">Solution</a><a class="nl" href="demo.html">Démo</a><a class="nl" href="ia.html">IA</a><a class="nl" href="business.html">Business</a><a class="nl" href="equipe.html">Équipe</a></nav></div>
<div class="w" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:center;padding-top:40px;padding-bottom:80px">
<div>
<div class="eb">AI4Youth · Lomé 2026 · Défi cybersécurité</div>
<h1 style="font-size:clamp(38px,5.6vw,66px);line-height:1.02">La fraude mobile money, <span style="color:#067047">bloquée</span> au moment exact de l'attaque.</h1>
<p class="mut" style="font-size:19px;margin:22px 0 30px;max-width:520px">Une application Android qui protège l'utilisateur sur son téléphone, dans sa langue. Essayez : choisissez une langue, puis laissez l'« agent » vous appeler.</p>
<a class="btn" href="demo.html">Voir la démo complète</a> <a class="btn" href="probleme.html" style="background:#fff;color:#067047;border:1px solid #067047">Comprendre le problème</a>
</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:18px">
<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="5"><button class="pill" style="{{l.style}}" onClick="{{ l.pick }}">{{l.label}}</button></sc-for>
</div>
<div style="width:280px;height:540px;border-radius:42px;background:#0B1F16;padding:12px;box-sizing:border-box;box-shadow:0 40px 70px -24px rgba(6,112,71,.5)">
<sc-if value="{{ show0 }}" hint-placeholder-val="{{ true }}">
<div style="height:100%;border-radius:31px;background:#12261C;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:44px 22px 28px;box-sizing:border-box">
<div><div style="color:#8FB3A0;font-size:14px;letter-spacing:.1em">APPEL ENTRANT</div><div style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:30px;font-weight:800;margin-top:10px">« Agent MTN »</div></div>
<div style="color:#CFE3D8;line-height:1.5;font-size:17px">« Tapez ce code de mise à jour pour garder votre compte. »</div>
<div style="display:flex;flex-direction:column;gap:12px;width:100%">
<button class="btn" onClick="{{ typeCode }}" style="width:100%">Taper le code</button>
<span style="color:#8FB3A0;font-size:13px">Comme Maman Adjovi, à Dantokpa</span>
</div></div>
</sc-if>
<sc-if value="{{ show1 }}" hint-placeholder-val="{{ false }}">
<div style="height:100%;border-radius:31px;background:#C62F25;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:36px 22px 28px;box-sizing:border-box">
<div class="pulse" style="width:84px;height:84px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(255,255,255,.6)"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#C62F25" stroke-width="2.4" aria-hidden="true"><path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18v.5"/></svg></div>
<div><div style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:28px;font-weight:800">Code bloqué</div><div style="margin-top:12px;font-size:18px;line-height:1.45">{{ alertText }}</div></div>
<div style="width:100%"><div style="background:#fff;color:#C62F25;font-weight:700;border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px">45 000 F CFA protégés</div><button class="pill" onClick="{{ replay }}" style="width:100%;border-color:#fff;background:transparent;color:#fff">Rejouer</button></div>
</div>
</sc-if>
</div>
</div>
</div>

<div style="background:#fff;border-top:1px solid #DCE8E0;border-bottom:1px solid #DCE8E0">
<div class="w g" style="padding-top:44px;padding-bottom:44px;gap:28px">
<div><div class="big">4 Mds $</div><div class="mut">de pertes en Afrique liées à la fraude mobile en 2026</div></div>
<div><div class="big">90 %</div><div class="mut">des opérateurs signalent des fraudes identitaires</div></div>
<div><div class="big">93 %</div><div class="mut">de fraudes détectées en test</div></div>
<div><div class="big">19,3 Ko</div><div class="mut">modèle embarqué, hors ligne</div></div>
</div></div>

<div class="w" style="padding-top:64px;padding-bottom:80px"><div class="g">
<a class="c" href="ia.html" style="text-decoration:none;color:inherit"><div class="eb">Le modèle</div><h3 style="font-size:22px">93 % des fraudes détectées</h3><p class="mut" style="margin:8px 0 0">Comparez les 4 modèles en direct →</p></a>
<a class="c" href="solution.html" style="text-decoration:none;color:inherit"><div class="eb">La solution</div><h3 style="font-size:22px">Pendant l'attaque</h3><p class="mut" style="margin:8px 0 0">Problème, 3 couches de protection, 5 langues →</p></a>
<a class="c" href="equipe.html" style="text-decoration:none;color:inherit"><div class="eb">L'équipe</div><h3 style="font-size:22px">Une vision panafricaine</h3><p class="mut" style="margin:8px 0 0">Qui nous sommes et où va BAMM →</p></a>
</div></div>
<div class="w mut" style="padding-top:28px;padding-bottom:36px;font-size:13px">Sources : GSMA (2025) · TechNext24 (2024) · Tech With Africa (2026) · Lundberg &amp; Lee (2017), SHAP, NeurIPS. · BAMM · AI4Youth · Lomé 2026</div>

</div>
</template>
<script src="assets/runtime.js"></script>
<script>

class Component extends DCLogic {
constructor(props) { super(props); this.state = { step: 0, lang: 'fon' }; }
renderVals() {
const on = 'background:#067047;color:#fff;border-color:#067047';
const T = { fon: "Alɔ elɔ nyí ajotɔ́ sín alɔ wɛ. Ma ná mɛdɛbǔ hùn towe ó.", fr: "Cet appel vient d'un arnaqueur. Ne donne ton code à personne.", yo: "[Alerte en yoruba à insérer]", de: "[Alerte en dendi à insérer]", ba: "[Alerte en bariba à insérer]" };
const langs = [['fon','Fon'],['yo','Yoruba'],['de','Dendi'],['ba','Bariba'],['fr','Français']].map(([id,label]) => ({ label, style: this.state.lang === id ? on : '', pick: () => this.setState({ lang: id, step: 1 }) }));
return { langs, show0: this.state.step === 0, show1: this.state.step === 1, alertText: T[this.state.lang], typeCode: () => this.setState({ step: 1 }), replay: () => this.setState({ step: 0 }) };
}
}

boot(Component);
</script>
</body>
</html>
