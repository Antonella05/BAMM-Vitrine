<div class="w" style="padding-top:56px;padding-bottom:56px"><div class="eb">Le problème</div>
<h2 style="max-width:820px">La fraude mobile money frappe fort et vite.</h2>
<div class="g" style="margin-top:36px"><div><div class="big">4 Mds $</div><p class="mut" style="margin:8px 0 0">de pertes en Afrique liées à la fraude mobile en 2026</p></div><div><div class="big">90 %</div><p class="mut" style="margin:8px 0 0">des opérateurs signalent des cas de fraude identitaire</p></div><div><div class="big">2</div><p class="mut" style="margin:8px 0 0">vecteurs dominants au Bénin : le vishing et la manipulation USSD</p></div></div></div>
<div class="w" style="padding-bottom:64px"><div class="eb">Une arnaque en 4 temps</div>
<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
<div class="c"><div class="big" style="color:#C9E3D4">1</div><h3 style="font-size:20px;margin-top:8px">L'appel</h3><p class="mut" style="margin:8px 0 0">Un homme se présente comme agent MTN.</p></div>
<div class="c"><div class="big" style="color:#C9E3D4">2</div><h3 style="font-size:20px;margin-top:8px">La pression</h3><p class="mut" style="margin:8px 0 0">Il dicte un code « de mise à jour ».</p></div>
<div class="c"><div class="big" style="color:#C9E3D4">3</div><h3 style="font-size:20px;margin-top:8px">Le code USSD</h3><p class="mut" style="margin:8px 0 0">Maman Adjovi, vendeuse à Dantokpa, le tape.</p></div>
<div class="c" style="background:#FFF4F1;border-color:#F3CFC7"><div class="big" style="color:#C2392B">4</div><h3 style="font-size:20px;margin-top:8px">La perte</h3><p class="mut" style="margin:8px 0 0">45 000 francs CFA disparaissent : la recette d'une semaine.</p></div></div>
<p style="font-size:20px;line-height:1.5;max-width:760px;margin:28px 0 0">Elle ne parle pas français et n'a jamais vu la vidéo de sensibilisation. <b>Elle n'a pas été piégée par sa naïveté : aucune solution n'était conçue pour elle.</b></p></div>
<div class="w" style="padding-bottom:88px"><div class="eb">Pourquoi les solutions actuelles échouent</div>
<div class="g"><div class="c"><h3 style="font-size:21px">Sensibilisation MTN</h3><p class="mut" style="margin:10px 0 0">Vidéos et site web : informe avant l'attaque, mais en français uniquement. L'utilisateur doit s'en souvenir sous la pression d'un appel.</p></div><div class="c"><h3 style="font-size:21px">Solutions opérateur (Subex, Orca)</h3><p class="mut" style="margin:10px 0 0">Détection après l'attaque, côté réseau, via des dashboards techniques en anglais réservés aux équipes anti-fraude.</p></div><div class="c" style="background:#E2F5EA;border-color:#067047"><h3 style="font-size:21px">Le maillon manquant</h3><p class="mut" style="margin:10px 0 0">Aucune solution ne protège l'utilisateur final, sur son téléphone, au moment précis où la fraude s'exécute.</p></div></div>
